# Builds every service image and pushes it to GitHub Container Registry, so the
# server only ever pulls. Building on the box itself would have the Maven build
# competing for memory with the six JVMs already running there.
name: Publish images

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      # One service failing should not hide whether the others build.
      fail-fast: false
      matrix:
        include:
          - name: gateway
            context: ./backend
            module: gateway
          - name: user-service
            context: ./backend
            module: user-service
          - name: expense-service
            context: ./backend
            module: expense-service
          - name: report-service
            context: ./backend
            module: report-service
          - name: quest-service
            context: ./backend
            module: quest-service
          - name: notification-service
            context: ./backend
            module: notification-service
          - name: frontend
            context: ./frontend
            module: ""

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects an uppercase path and this repository has one, so lowercase
      # it explicitly rather than relying on the action to do it.
      - id: repo
        run: echo "lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.lower }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.module != '' && format('MODULE={0}', matrix.module) || '' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Each service is a separate cache scope: they share a Maven parent but
          # produce different layers, and one scope would thrash between them.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
