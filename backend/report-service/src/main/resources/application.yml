server:
  port: 8083

spring:
  application:
    name: report-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/reports_db}
    username: ${SPRING_DATASOURCE_USERNAME:finance}
    password: ${SPRING_DATASOURCE_PASSWORD:finance}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: none   # Flyway owns the schema
    open-in-view: false
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}

auth:
  jwks-uri: ${AUTH_JWKS_URI:http://localhost:8081/api/v1/auth/jwks}

macro:
  ins:
    cpi-url: ${MACRO_INS_CPI_URL:https://api.insse.ro/shk/v1/cpi/latest}
  anre:
    tariff-url: ${MACRO_ANRE_TARIFF_URL:https://api.anre.ro/v1/tariffs/energy/latest}
  http:
    connect-timeout-ms: ${MACRO_HTTP_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${MACRO_HTTP_READ_TIMEOUT_MS:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
