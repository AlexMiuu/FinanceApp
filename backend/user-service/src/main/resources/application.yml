server:
  port: 8081
  forward-headers-strategy: framework   # trust X-Forwarded-* from nginx/gateway for OAuth redirect URIs

spring:
  application:
    name: user-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/users_db}
    username: ${SPRING_DATASOURCE_USERNAME:finance}
    password: ${SPRING_DATASOURCE_PASSWORD:finance}
  flyway:
    enabled: true
  jpa:
    hibernate:
      # Flyway owns the schema. Not 'validate': Hibernate's validator can't map
      # the pg-specific column types we use (citext, char(3) -> bpchar).
      ddl-auto: none
    open-in-view: false

auth:
  access-token-ttl: 15m
  refresh-token-ttl: 30d
  cookie-secure: ${AUTH_COOKIE_SECURE:false}   # true once served over HTTPS
  registration-enabled: ${AUTH_REGISTRATION_ENABLED:true}   # false closes signup on a public deployment
  jwt:
    private-key-pem: ${AUTH_JWT_PRIVATE_KEY_PEM:}   # PKCS#8 PEM; ephemeral key when empty (dev)
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}

privacy:
  erasure:
    # Includes report,quest,notification even though those services have no
    # erasure handler yet (M9): they hold user-scoped data today, so an
    # erasure request must stay honestly PENDING rather than flip to
    # COMPLETED while their rows are still untouched. M9 adds the handlers
    # that make these acks actually arrive — see docs/erasure-event-contract.md.
    expected-services: user,expense,report,quest,notification

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
